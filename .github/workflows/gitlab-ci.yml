stages:
  - preflight
  - lint
  - deploy-fleet

variables:
  WATCHDOG_NAMESPACE: "watchdog-system"
  HELM_CHART_PATH: "./helm/watchdog-aidr"
  ANSIBLE_INVENTORY: "ansible/inventory.ini"

validate_cluster_credentials:
  stage: preflight
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash openssl
    - mkdir -p /root/.kube
    - echo "${KUBECONFIG_EAST_PROD}" > /root/.kube/config-east
    - echo "${KUBECONFIG_WEST_SOVEREIGN}" > /root/.kube/config-west
  script:
    - chmod +x ci/verify_kubeconfig.sh
    - ci/verify_kubeconfig.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

kernel_compatibility_check:
  stage: preflight
  image: python:3.11-slim
  script:
    - python3 detection/verify_ebpf_quarantine_core.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

helm_lint_validation:
  stage: lint
  image: alpine/helm:3.14.0
  script:
    - helm lint ${HELM_CHART_PATH}

execute_ansible_rollout:
  stage: deploy-fleet
  image: williamyeh/ansible:ubuntu22.04
  before_script:
    - apt-get update && apt-get install -y python3-kubernetes
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG_EAST_PROD}" > ~/.kube/config-east
    - echo "${KUBECONFIG_WEST_SOVEREIGN}" > ~/.kube/config-west
    - chmod 600 ~/.kube/config-east ~/.kube/config-west
  script:
    - ansible-playbook -i ${ANSIBLE_INVENTORY} ansible/deploy_watchdog_fleet.yml
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
