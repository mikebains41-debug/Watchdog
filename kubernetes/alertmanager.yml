global:
  resolve_timeout: 5m
route:
  group_by: ['alertname', 'cluster', 'node', 'gpu_id']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'watchdog-siem-bridge'
  routes:
    - match:
        tier: ai-infrastructure
      receiver: 'watchdog-siem-bridge'
      continue: true
receivers:
  - name: 'watchdog-siem-bridge'
    webhook_configs:
      - url: 'http://watchdog-api:8080/v2/alerts/webhook'
        send_resolved: true
        http_config:
          bearer_token_file: /var/run/secrets/watchdog/bearer_token
