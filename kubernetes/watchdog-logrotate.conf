/var/log/watchdog/*.log {
    su root root
    daily
    rotate 90
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        python3 /opt/watchdog/forensics/audit_ledger.py --rehash-chain >> /var/log/watchdog/rotation_history.hash 2>/dev/null || true
    endscript
}
